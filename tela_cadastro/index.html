<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro Simples</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 400px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn-gravar {
            background-color: #28a745;
            color: white;
        }

        .btn-limpar {
            background-color: #dc3545;
            color: white;
        }
    </style>

</head>

<body>

    <h2>Cadastro</h2>

    <form id="meuFormulario">
        <div class="form-group">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
        </div>

        <div class="form-group">
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
        </div>

        <div class="form-group">
            <label for="gmail">Gmail:</label>
            <input type="email" id="gmail" name="gmail" placeholder="exemplo@gmail.com">
        </div>

        <div class="btn-group">
            <button type="button" class="btn-gravar" id="btnGravar">Gravar</button>
            <button type="button" class="btn-limpar" id="btnLimpar">Limpar</button>
        </div>
    </form>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        $(document).ready(function () {

            $('#btnGravar').on('click', function () {

                var nome = $('#nome').val();
                var telefone = $('#telefone').val();
                var gmail = $('#gmail').val();

                $.ajax({
                    url: "script.php",
                    type: "POST",
                    data: "Nome=" + nome + "&telefone=" + telefone + "&email=" + gmail,
                    dataType: "html"

                }).done(function (resposta) {
                    console.log(resposta);

                }).fail(function (jqXHR, textStatus) {
                    console.log("Request failed: " + textStatus);

                }).always(function () {
                    console.log("completou");

                });

            });

            $('#btnLimpar').on('click', function () {
                $('#meuFormulario')[0].reset();
                $('#nome').focus();
            });
        });
    </script>

</body>

</html>
