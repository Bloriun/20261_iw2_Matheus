<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Calculadora Simples</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 400px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn-gravar {
            background-color: #28a745;
            color: white;
        }

        .btn-limpar {
            background-color: #dc3545;
            color: white;
        }

        #texto {
            margin-top: 20px;
        }

        #historico {
            padding-left: 0;
            list-style: none;
        }

        #historico li {
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

    <h2>Calculadora</h2>

    <form id="meuFormulario">
        <div class="form-group">
            <label for="numero1">Número 1:</label>
            <input type="text" id="numero1" name="numero1" placeholder="Digite o primeiro número">
        </div>

        <div class="form-group">
            <label for="numero2">Número 2:</label>
            <input type="text" id="numero2" name="numero2" placeholder="Digite o segundo número">
        </div>

        <div class="btn-group">
            <button type="button" class="btn-gravar btn-operacao" data-operacao="somar">+</button>
            <button type="button" class="btn-gravar btn-operacao" data-operacao="subtrair">-</button>
            <button type="button" class="btn-gravar btn-operacao" data-operacao="multiplicar">*</button>
            <button type="button" class="btn-gravar btn-operacao" data-operacao="dividir">/</button>
        </div>

        <div class="btn-group">
            <button type="button" class="btn-limpar" id="btnLimpar">Limpar</button>
        </div>

        <div id="texto">
            <h3>Histórico</h3>
            <ol id="historico"></ol>
        </div>
    </form>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
    $(document).ready(function () {
        var historico = [];
        var simbolos = {
            somar: '+',
            subtrair: '-',
            multiplicar: '*',
            dividir: '/'
        };

        $('.btn-operacao').on('click', function () {
            var n1 = $('#numero1').val();
            var n2 = $('#numero2').val();
            var op = $(this).data('operacao');

        $.ajax({
            url: "php.php", 
            type: "POST",
            data: {
                numero1: n1,
                numero2: n2,
                operacao: op
            },
            dataType: "html"
        }).done(function (resposta) {
            var operacao = n1 + ' ' + simbolos[op] + ' ' + n2 + ' = ' + resposta;

            historico.push(operacao);
            $('#historico').append('<li>' + operacao + '</li>');
        }).fail(function () {
            $('#texto').prepend('<p style="color:red;">Erro ao calcular.</p>');
        });
        });

        $('#btnLimpar').on('click', function () {
            $('#meuFormulario')[0].reset();
            historico = [];
            $('#historico').html('');
            $('#numero1').focus();
        });
    });
    </script>
</body>

</html>
