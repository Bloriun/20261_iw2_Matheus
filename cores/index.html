<head>

    <script>
        $(document).ready(function(){
            let corAtual = 'preto';
            let fonteTamanho = 16;
            let tiopoFonte = 'Arial';

            function atualizarFonte(novoTamanho){
                fonteTamanho = novoTamanho;
                $('p').css('font-size', novoTamanho + 'px');
            }

            function atualizarFonte(novoTamanho){
                fonteTamanho = novoTamanho;
                $('p').css('font-size', novoTamanho + 'px');
            }
            

            function atualizarCor(novaCor){
                corAtual = novaCor;
                $('p').css('color', novaCor);
            };

            $('#exibirfonte').click(function(){
                alert('O tamanho da fonte atual é: ' + fonteTamanho + 'px');
            });
            
            $('#AlmentarFonte').click(function(){
                atualizarFonte(fonteTamanho + 2);
            });

            $('#DiminuirFonte').click(function(){
                atualizarFonte(fonteTamanho - 2);
            });



            $('#Exibir').click(function(){
                alert('A cor atual é: ' + corAtual);
            });

            $('#Verde').click(function(){
                atualizarCor('Green');
            });

            $('#Azul').click(function(){
                atualizarCor('Blue');
            });

            $('#Amarelo').click(function(){
                atualizarCor('Yellow');
            });
        });
    </script>
