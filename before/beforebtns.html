<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo jQuery</title>
    
   
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    
    <script>
        $(document).ready(function(){
            
            $("#btn1").click(function(){
                $("p").before("<b> before </b>");
            });

            $("#btn2").click(function(){
                $("p").after("<b> after </b>");
            });

            $("#btn3").click(function(){
                $("li").append("<b> append()</b>");
            });

            $("#btn4").click(function(){
                $("li").prepend("<b>prepend() </b>");
            });

                    $("#btn5").click(function(){
                $("li").remove();
            });
                        $("#btn6").click(function(){
                $("li").empty();
            });
        }); 
    </script>
</head>
<body>
    <button id="btn1">before</button>
    <button id="btn2">after</button>
    <button id="btn3">append()</button>
    <button id="btn4">prepend()</button>
    <button id="btn5">remove()</button>
    <button id="btn6">empty()</button>

    <p>oi diognes</p>

    <ol>
        
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ol>
</body>
</html>
